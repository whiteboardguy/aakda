<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Aakda{% endblock %}</title>

  <!-- DaisyUI (components) -->
  <link href="/static/css/daisyui.min.css" rel="stylesheet" />
  <!-- Tailwind CSS (utilities) -->
  <script src="/static/js/tailwind.cdn.js"></script>
  <!-- highlight.js — theme CSS loaded before content renders -->
  <link rel="stylesheet" href="/static/css/hljs-github-dark-dimmed.min.css" />

  <!-- Site-wide design system -->
  <link rel="stylesheet" href="/static/css/_site.css" />
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <!-- Chart expand modal (singleton, reused for all charts) -->
  <div id="chart-modal" class="chart-modal" role="dialog" aria-modal="true" aria-label="Expanded chart" onclick="handleChartModalBackdropClick(event)">
    <div class="chart-modal-inner">
      <button class="chart-modal-close" onclick="closeChartModal()" aria-label="Close expanded chart" title="Close (Esc)">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 6L6 18" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          <path d="M6 6L18 18" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
      </button>
      <!-- Loading spinner — visible until iframe content is ready -->
      <div id="chart-modal-loader" class="chart-modal-loader">
        <div class="chart-modal-spinner"></div>
      </div>
      <iframe id="chart-modal-iframe"
              sandbox="allow-scripts"
              class="chart-modal-iframe"
              title="Expanded chart">
      </iframe>
    </div>
  </div>

  <!-- HTMX (loaded synchronously so attributes are processed immediately) -->
  <script src="/static/js/htmx.min.js"></script>
  <!-- HTMX SSE extension -->
  <script src="/static/js/htmx-sse.js"></script>
  <!-- Markdown parser -->
  <script src="/static/js/marked.min.js"></script>
  <!-- Code syntax highlighter -->
  <script src="/static/js/highlight.min.js"></script>
  <!-- App JS -->
  <script src="/static/js/main.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
