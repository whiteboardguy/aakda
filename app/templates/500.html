{% extends "base.html" %}

{% block title %}500 — Aakda{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/login.css" />
<style>
  @keyframes fly-up {
    from { transform: translateY(0);     opacity: 0.55; }
    to   { transform: translateY(-100%); opacity: 0; }
  }
  @keyframes jerk {
    0%   { transform: translateY(0); }
    18%  { transform: translateY(-22px); }
    100% { transform: translateY(0); }
  }
  .bait-wrap {
    position: fixed;
    top: 0;
    left: 6rem;
    width: 220px;
    cursor: pointer;
    animation: jerk 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
  }
  .bait-wrap.leaving {
    animation: fly-up 0.45s cubic-bezier(0.55, 0, 1, 0.45) forwards;
    pointer-events: none;
  }
  .bait-label {
    display: block;
    text-align: center;
    font-family: monospace;
    font-size: 0.75rem;
    opacity: 0.5;
    position: relative;
    z-index: 10;
    margin-top: 4px;
  }
  .bait-svg {
    display: block;
    width: 220px;
    height: 220px;
    opacity: 0.55;
  }
</style>
{% endblock %}

{% block content %}
<div class="bait-wrap"
  onmouseenter="this.querySelector('.bait-label').textContent='hah! caught ya..'; this.classList.add('leaving'); this.addEventListener('animationend', () => window.location.href='/', {once:true})">

  <span class="bait-label">hover me</span>
</div>

<div class="auth-page">
  <div style="display:flex;align-items:center;gap:3rem;max-width:680px;width:100%;padding:2rem;">

    <!-- Text content -->
    <div style="text-align:center;">
      <p style="font-size:3rem;font-weight:600;color:var(--ak-text-dim);line-height:1;">500</p>
      <p style="margin-top:0.75rem;color:var(--ak-text-muted);font-size:0.95rem;">Something went wrong on our end.</p>
      <a href="/" style="display:inline-block;margin-top:1.5rem;color:var(--ak-accent);text-decoration:underline;text-underline-offset:3px;font-size:0.9rem;">Go home</a>
    </div>

    <!-- Tornado thought thing -->
